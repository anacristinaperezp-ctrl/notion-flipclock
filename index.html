<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fuente para números -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<!-- Fuente para labels -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">

<style>
:root{
  --card:#3a3a3a;
  --text:#f5f5f5;
  --line:rgba(255,255,255,0.35);
}

body{
  margin:0;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
}

.clock{
  display:flex;
  gap:14px;
}

.card{
  position:relative;
  width:150px;
  height:190px;
  background:var(--card);
  border-radius:26px;
  overflow:hidden;
}

/* números grandes */
.big{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'Bebas Neue', sans-serif;
  font-size:140px;     /* esta fuente es más alta */
  letter-spacing:2px;
  color:var(--text);
  transform:translateY(-10px);
}

/* línea central */
.card::after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:1px;
  background:var(--line);
}

/* labels */
.label-left{
  position:absolute;
  left:16px;
  bottom:14px;
  font-family:'Inter', sans-serif;
  font-size:16px;
  font-weight:600;
  color:var(--text);
}

.label-right{
  position:absolute;
  right:16px;
  bottom:14px;
  font-family:'Inter', sans-serif;
  font-size:16px;
  font-weight:600;
  color:var(--text);
  text-transform:uppercase;
}
</style>
</head>

<body>
  <div class="clock">
    <div class="card">
      <div class="big" id="hh">00</div>
      <div class="label-left" id="ampm">AM</div>
    </div>

    <div class="card">
      <div class="big" id="mm">00</div>
      <div class="label-right" id="day">SUNDAY</div>
    </div>
  </div>

<script>
function pad(n){ return n < 10 ? "0"+n : n; }

function update(){
  const now = new Date();
  let h = now.getHours();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;

  const m = now.getMinutes();
  const day = now.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase();

  document.getElementById("hh").textContent = pad(h);
  document.getElementById("mm").textContent = pad(m);
  document.getElementById("ampm").textContent = ampm;
  document.getElementById("day").textContent = day;
}

update();
setInterval(update,1000);
</script>

</body>
</html>
