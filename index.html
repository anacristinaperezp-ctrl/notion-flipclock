<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Flip Clock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --card:#3a3a3a;
  --text:#f5f5f5;
  --line:rgba(255,255,255,0.22);
}

body{
  margin:0;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Oswald', sans-serif;
}

/* MÁS PEQUEÑO Y PROPORCIONAL */
.clock{
  display:flex;
  gap:3px;
}

.card{
  position:relative;
  width:90px;        /* más estrechas */
  height:135px;      /* más bajas */
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
}

/* números */
.big{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
  font-size:74px;    /* más pequeño */
  font-weight:700;
  letter-spacing:-1px;
  line-height:1;
  transform:translateY(-3px);
}

/* línea central */
.card::after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:1px;
  background:var(--line);
}

/* labels */
.label-left, .label-right{
  position:absolute;
  bottom:5px;
  font-size:11px;
  font-weight:600;
  color:var(--text);
  text-transform:uppercase;
  letter-spacing:0.4px;
}

.label-left{ left:8px; }
.label-right{ right:8px; }
</style>
</head>

<body>

<div class="clock">
  <div class="card">
    <div class="big" id="hh">00</div>
    <div class="label-left" id="ampm">AM</div>
  </div>

  <div class="card">
    <div class="big" id="mm">00</div>
    <div class="label-right" id="day">MONDAY</div>
  </div>
</div>

<script>
function pad(n){ return n < 10 ? "0"+n : ""+n; }

function updateClock(){
  const now = new Date();

  let h = now.getHours();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;

  const m = now.getMinutes();
  const day = now.toLocaleDateString('en-US', { weekday:'long' }).toUpperCase();

  document.getElementById("hh").textContent = pad(h);
  document.getElementById("mm").textContent = pad(m);
  document.getElementById("ampm").textContent = ampm;
  document.getElementById("day").textContent = day;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
